name: Run Tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Run tests
        uses: isbang/compose-action@v1.2.0
        with:
          compose-file: "./dev.yml"
          run-command: |
            run --rm django python manage.py test
